<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review memory proposals</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#20252b;--muted:#687581;--border:#d9dfe6;--accent:#2865c7;--chip:#edf2f8;--danger:#b32330;--add:#e9f7ee;--remove:#fff0f0;--ok:#16733a}
@media(prefers-color-scheme:dark){:root{--bg:#161b22;--surface:#1c222b;--text:#e5ebf3;--muted:#9baabd;--border:#344252;--accent:#76a9ff;--chip:#293747;--danger:#ff8d96;--add:#153125;--remove:#3d2329;--ok:#8bdda3}}
html[data-theme=light]{--bg:#f7f7f5;--surface:#fff;--text:#20252b;--muted:#687581;--border:#d9dfe6;--accent:#2865c7;--chip:#edf2f8;--danger:#b32330;--add:#e9f7ee;--remove:#fff0f0;--ok:#16733a}
html[data-theme=dark]{--bg:#161b22;--surface:#1c222b;--text:#e5ebf3;--muted:#9baabd;--border:#344252;--accent:#76a9ff;--chip:#293747;--danger:#ff8d96;--add:#153125;--remove:#3d2329;--ok:#8bdda3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1100px;margin:auto;padding:20px 20px 80px}header,.batch-head,.item-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header{margin-bottom:18px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0}h3{font-size:13px;margin:8px 0}.muted,summary{color:var(--muted);font-size:12px}button,input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 10px}button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg);font-weight:600}button:disabled{opacity:.5;cursor:default}.batch{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:16px 0;padding:16px}.item{border-top:1px solid var(--border);margin-top:12px;padding-top:14px}.badge{background:var(--chip);color:var(--muted);padding:2px 9px;border-radius:20px;font-size:12px}.state-approved{color:var(--ok)}.state-rejected{color:var(--danger)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.fact{font-size:13px;white-space:pre-wrap}.fact b{display:block;color:var(--muted);font-size:12px}.comparison,.metadata{display:grid;grid-template-columns:1fr 1fr;gap:12px}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border:1px solid var(--border);border-radius:6px;font:12px/1.6 ui-monospace,Consolas,monospace;margin:6px 0}.diff span{display:block;white-space:pre-wrap}.diff-add{background:var(--add)}.diff-remove{background:var(--remove)}summary{cursor:pointer}details{margin:12px 0}textarea{width:100%;resize:vertical}label{display:block;margin:9px 0}input{width:100%}.verdict{display:flex;align-items:center;gap:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}.error,.warning{color:var(--danger)}.result{color:var(--ok)}#message:not(:empty){padding:12px;border:1px solid var(--border);border-radius:8px}.empty{text-align:center;margin:60px 0;color:var(--muted)}.batch-head b{font-size:12px;overflow-wrap:anywhere}
select{max-width:100%;min-width:0}.verdict select{flex:1}.comparison>section,.metadata>label,.fact{min-width:0;overflow-wrap:anywhere}
@media(max-width:700px){main{padding:12px}.comparison,.facts,.metadata{grid-template-columns:1fr}.actions{flex-wrap:wrap}}
</style></head><body><main><header><div><h1 id="title"></h1><div class="muted" id="project"></div></div><button id="refresh"></button></header><div id="message" role="status"></div><div id="task-diagnostics"></div><div id="list"></div><div id="history"></div></main><script src="ui.js"></script><script src="app.js"></script></body></html>
